<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Timetable</title>
    <style>
        
        

        th, td {
            border: 1px dashed ;
            padding: 10px 15px;
            text-align: center;
        }

        th {
            font-weight: bold;
        }
    </style>
</head>
<body>

    <table>
        <th>
            <tr>
                <th colspan="5">SEMESTER 1: CLASS TIMETABLE</th>
            </tr>
            <tr>
                <th>Time Slot</th>
                <th>Monday</th>
                <th>Tuesday</th>
                <th>Wednesday</th>
                <th>Thursday</th>
            </tr>
        </th>
        <tbody>
            <tr>
                <td>09:00 - 10:00</td>
                <td>Web Design Theory</td>
                <td>Database Systems</td>
                <td>System Analysis</td>
                <td>Math 101</td>
            </tr>
            <tr>
                <td>10:00 - 12:00</td>
                <td rowspan="2" colspan="2">Web Programming Lab</td>
                <td>Network Security</td>
                <td rowspan="3">Office Hours</td>
            </tr>
            <tr>
                <td>11:00 - 12:00</td>
                <td>Operating Systems</td>
            </tr>
            <tr>
                <td>12:00 - 01:00</td>
                <td colspan="3">LUNCH BREAK</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
